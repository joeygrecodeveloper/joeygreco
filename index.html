<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joey Greco</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      padding: 36px 24px;
    }

    .sidebar-header {
      margin-bottom: 32px;
    }

    .sidebar-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #1a1a1a;
    }

    .sidebar-subtitle {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    nav {
      flex: 1;
    }

    nav ul {
      list-style: none;
    }

    nav ul li + li {
      margin-top: 2px;
    }

    nav a {
      display: block;
      padding: 6px 8px;
      border-radius: 5px;
      text-decoration: none;
      color: #555;
      font-size: 13px;
      transition: background 0.1s, color 0.1s;
    }

    nav a:hover {
      background: #f2f2f2;
      color: #1a1a1a;
    }

    nav a.active {
      font-weight: 600;
      color: #1a1a1a;
      background: #f0f0f0;
    }

    .sidebar-footer {
      padding-top: 24px;
      border-top: 1px solid #eee;
    }

    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: #888;
      font-size: 12px;
      transition: color 0.1s;
    }

    .sidebar-footer a:hover {
      color: #1a1a1a;
    }

    .sidebar-footer svg {
      flex-shrink: 0;
    }

    /* Main */
    .main {
      margin-left: 240px;
      flex: 1;
      height: 100vh;
      background: #f5f5f5;
      overflow: hidden;
    }

    .main iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-name">Joey Greco</div>
      <div class="sidebar-subtitle">Senior Product Manager</div>
    </div>

    <nav>
      <ul>
        <li><a href="#notesApp" data-project="notesApp">notesApp</a></li>
        <li><a href="#hereComesTheSun" data-project="hereComesTheSun">hereComesTheSun</a></li>
        <li><a href="#claude-bar" data-project="claude-bar">claude-bar</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <a href="https://github.com/joeygrecodeveloper" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
            .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
            .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        joeygrecodeveloper
      </a>
    </div>
  </aside>

  <main class="main" id="main-content"></main>

  <script>
    const projects = {
      hereComesTheSun: 'https://joeygrecodeveloper.github.io/hereComesTheSun/',
      notesApp:        'https://joeygrecodeveloper.github.io/notesApp/',
      'claude-bar':    'https://joeygrecodeveloper.github.io/claude-bar/',
    };

    const main = document.getElementById('main-content');
    const links = document.querySelectorAll('nav a');

    function load(project) {
      links.forEach(a => {
        a.classList.toggle('active', a.dataset.project === project);
      });

      main.innerHTML = '';

      const url = projects[project];
      if (url) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.title = project;
        main.appendChild(iframe);
      } else {
        const div = document.createElement('div');
        div.className = 'placeholder';
        div.textContent = 'coming soon';
        main.appendChild(div);
      }

      location.hash = project;
    }

    links.forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        load(a.dataset.project);
      });
    });

    const initial = location.hash.slice(1);
    load(initial in projects ? initial : 'notesApp');
  </script>

</body>
</html>
